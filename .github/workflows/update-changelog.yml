name: Update changelog

# Rebuilds the admin Changelog after every merge to main and writes it to the
# owner-only `site_changelog` table in Supabase (see the migration of the same
# name). The data is deliberately not committed or bundled into the site, so
# only a signed-in owner can read it.
#
# Uses the same SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF secrets as
# deploy-functions.yml; the management API runs the SQL as the database owner,
# which bypasses row level security.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-changelog
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/generate-changelog.mjs changelog.generated.sql
      - name: Write the changelog to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF must be set (same secrets as deploy-functions.yml)."
            exit 1
          fi
          jq -Rs '{query: .}' changelog.generated.sql > body.json
          curl --fail-with-body -sS -X POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @body.json
