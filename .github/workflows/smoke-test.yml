name: Model Studio smoke tests

# These cover the browser-side pipeline - the OpenSCAD worker, the mesh
# analysis, the 3MF writer and the three.js canvas. Every bug they assert
# against passed typecheck, lint and build before reaching production.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/openscad/**'
      - 'src/lib/mesh/**'
      - 'src/lib/threemf/**'
      - 'src/components/admin/ModelViewer.tsx'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --include=dev

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          CI: 'true'

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
