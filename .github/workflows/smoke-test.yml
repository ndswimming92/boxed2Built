name: Browser smoke tests

# These cover behaviour that only shows up in a real browser: the Model Studio
# pipeline - the OpenSCAD worker, the mesh analysis, the 3MF writer and the
# three.js canvas - admin popover geometry at phone widths, which submissions
# the inquiry working list keeps, the money a coupon code takes off a
# quote, and the admin job card — its facts, its money, its buttons and
# workflows, the drive-time, reminder and follow-up panels that go blank when an
# edge function refuses the browser's CORS preflight — and the customer
# portal's view of a job. Every bug they assert against passed
# typecheck, lint and build before reaching production.
#
# `smoke` is a REQUIRED status check, and that is why the path filter no longer
# lives on the trigger. (It is now the last of three stages — `scope`, the
# `browser-tests` shards, then `smoke` itself; see the notes above each job.)
#
# A filtered-out workflow reports nothing at all — it does not report "skipped".
# Branch protection then waits forever for a status that is never coming, and
# the pull request sits at "Expected — Waiting for status to be reported" with
# no way to merge it. #358 deadlocked exactly that way: it touched only
# ClientDetailModal.tsx and an edge function, so this workflow never ran, so the
# required check never reported.
#
# So the trigger fires on every pull request and the same path list is evaluated
# inside the job instead. In-scope changes run the full browser suite exactly as
# before; everything else reports success in a few seconds. Either way `smoke`
# always reports, which is the one thing a required check has to do.
#
# Deliberately NOT done: a second workflow with a matching job name triggered on
# `paths-ignore`. That reads like the inverse of `paths` and is not one — a pull
# request touching an in-scope file AND an out-of-scope file matches both
# filters, so both workflows run and two different `smoke` checks race to report
# on the same commit.
#
# The covered list below is unchanged from the trigger filter it replaces. Only
# where it is evaluated has moved, so which changes actually run the browser
# suite is exactly as it was.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Stage 1: decide whether the browser suite needs to run at all.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The scope check diffs against the base commit, which shallow
          # history would not contain.
          fetch-depth: 0

      - name: Does this change touch anything the browser tests cover?
        id: scope
        # Passed as env rather than interpolated into the script: a ${{ }}
        # expansion inside `run` is a script injection waiting to happen.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          COVERED='^(src/lib/(openscad|mesh|threemf)/'
          COVERED="$COVERED"'|src/lib/qrExport\.ts$'
          COVERED="$COVERED"'|src/components/admin/(ModelViewer|AdminLayout|NotificationBell|OrganizationSwitcher|InvoiceRowActions|InquiryDetailModal)\.tsx$'
          COVERED="$COVERED"'|src/components/ui/AnchoredPanel\.tsx$'
          COVERED="$COVERED"'|src/components/ContactForm\.tsx$'
          COVERED="$COVERED"'|src/pages/admin/(InquiriesPage|CouponsPage|JobsPage|BookingsPage)\.tsx$'
          COVERED="$COVERED"'|src/pages/portal/(JobsPage|JobDetailPage)\.tsx$'
          COVERED="$COVERED"'|src/components/portal/PortalLayout\.tsx$'
          COVERED="$COVERED"'|src/components/admin/(JobFollowupCard|JobReminderCard|JobTravelCard|TravelEstimateCard|JobInvoicesList|JobContractorsList|JobContractorModal|JobFormModal|JobCompletionWizard|SatisfactionRating|SignatureCapture|MarkJobLostModal|CancelJobModal|AttachInvoiceModal|InvoiceFormModal|ImportJobsModal|JobCalendarFeedModal|ClientDetailModal)\.tsx$'
          COVERED="$COVERED"'|src/services/(jobTravelService|jobReminderService|jobReminderLabels|jobFollowupService|jobFollowupLabels|jobStatusService|jobExportService|jobImportService|jobScheduleCalendarService|contractorService|invoiceService|bookingService|customerPortalService)\.ts$'
          COVERED="$COVERED"'|src/utils/(jobCalculations|jobAddress)\.ts$'
          COVERED="$COVERED"'|src/contexts/(AuthContext|PrivacyModeContext)\.tsx$'
          COVERED="$COVERED"'|src/lib/supabase\.ts$'
          COVERED="$COVERED"'|supabase/functions/(job-travel-estimate|send-customer-job-reminders|send-followup-email|send-job-schedule-email)/'
          COVERED="$COVERED"'|src/pages/ReferralRedirectPage\.tsx$'
          COVERED="$COVERED"'|src/services/(inquiryService|referralQRService|couponService)\.ts$'
          COVERED="$COVERED"'|src/utils/(inquiryWorkflow|utmAttribution|coupon)\.ts$'
          COVERED="$COVERED"'|tests/'
          COVERED="$COVERED"'|playwright\.config\.ts$'
          COVERED="$COVERED"'|package-lock\.json$)'

          # Every bail-out below runs the suite rather than skipping it. A scope
          # check that cannot see the diff must not be the reason a real
          # regression ships.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run — running the full suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base commit to diff against — running the full suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! CHANGED=$(git diff --name-only "$BASE_SHA" HEAD 2>&1); then
            echo "Could not diff against $BASE_SHA — running the full suite."
            echo "$CHANGED"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          if echo "$CHANGED" | grep -Eq "$COVERED"; then
            echo "In scope — running the browser suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing changed here is covered by the browser tests."
            echo "Reporting success without running them."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # Stage 2: the suite, split by feature area so the groups run side by side
  # on separate runners instead of one after another on a single worker. Each
  # group is a short list of spec files, named for what it proves. The suite
  # used to take about fourteen minutes serially; now it is as slow as its
  # slowest group (Model Studio, which compiles OpenSCAD to WASM).
  #
  # A new spec file under tests/ must be added to a group below, or it will
  # not run in CI. `npm run test:smoke` still runs everything locally.
  browser-tests:
    name: ${{ matrix.name }}
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One failing group must not hide the results of the others.
      fail-fast: false
      matrix:
        include:
          - name: Model Studio (OpenSCAD, mesh, 3MF, 3D canvas)
            files: tests/model-studio.spec.ts
          - name: Admin layout on a phone
            files: tests/mobile-layout.spec.ts
          - name: Inquiries, coupons and referral QR codes
            files: tests/inquiries-workflow.spec.ts tests/coupons.spec.ts tests/referral-qr.spec.ts
          - name: Job card - what it shows and its email panels
            files: tests/job-card.spec.ts
          - name: Job card - workflows (lost, cancel, complete, edit, invoices)
            files: tests/job-card-workflows.spec.ts
          - name: Job lists, import/export and customer portal job pages
            files: tests/job-card-surfaces.spec.ts
          - name: Contact form, news and portal sign-in
            files: tests/contact-form.spec.ts tests/news.spec.ts tests/portal-login.spec.ts tests/portal-callback.spec.ts
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --include=dev

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.name }}
        run: npx playwright test ${{ matrix.files }}
        env:
          CI: 'true'

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Artifact names must be unique per matrix leg.
          name: playwright-report-${{ strategy.job-index }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Stage 3: the one check branch protection waits for. It keeps the name
  # `smoke` so the required status does not change, and it reports a single
  # pass/fail for all the groups above. It runs even when a group fails
  # (`always()`), because a skipped required check would leave the pull
  # request waiting forever instead of failing.
  smoke:
    needs: [scope, browser-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Did every browser test group pass?
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          TESTS_RESULT: ${{ needs.browser-tests.result }}
        run: |
          echo "scope:         $SCOPE_RESULT"
          echo "browser-tests: $TESTS_RESULT"
          # `skipped` is the normal result when the change touches nothing the
          # browser tests cover.
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "The scope check did not finish."
            exit 1
          fi
          if [ "$TESTS_RESULT" != "success" ] && [ "$TESTS_RESULT" != "skipped" ]; then
            echo "At least one browser test group failed or was cancelled."
            exit 1
          fi
