name: Browser smoke tests

# These cover behaviour that only shows up in a real browser: the Model Studio
# pipeline - the OpenSCAD worker, the mesh analysis, the 3MF writer and the
# three.js canvas - admin popover geometry at phone widths, which submissions
# the inquiry working list keeps, and the money a coupon code takes off a
# quote. Every bug they assert against passed typecheck, lint and build before
# reaching production.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/openscad/**'
      - 'src/lib/mesh/**'
      - 'src/lib/threemf/**'
      - 'src/components/admin/ModelViewer.tsx'
      # Popover positioning and the admin chrome the mobile specs measure.
      - 'src/components/ui/AnchoredPanel.tsx'
      - 'src/components/admin/AdminLayout.tsx'
      - 'src/components/admin/NotificationBell.tsx'
      - 'src/components/admin/OrganizationSwitcher.tsx'
      - 'src/components/admin/InvoiceRowActions.tsx'
      # The inquiry working list: which submissions it holds on to.
      - 'src/pages/admin/InquiriesPage.tsx'
      - 'src/components/admin/InquiryDetailModal.tsx'
      - 'src/utils/inquiryWorkflow.ts'
      - 'src/services/inquiryService.ts'
      # Coupon codes: what a customer is quoted after entering one.
      - 'src/components/ContactForm.tsx'
      # Referral QR codes: what a scanned thank-you token puts in that same box.
      - 'src/pages/ReferralRedirectPage.tsx'
      - 'src/services/referralQRService.ts'
      - 'src/lib/qrExport.ts'
      - 'src/utils/utmAttribution.ts'
      - 'src/pages/admin/CouponsPage.tsx'
      - 'src/services/couponService.ts'
      - 'src/utils/coupon.ts'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --include=dev

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          CI: 'true'

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
