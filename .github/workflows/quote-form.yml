name: Quote form

# The form a customer fills in to ask for service is the only way work comes in,
# and it is the one thing here that breaks silently: a submission that no longer
# reaches the database still renders, still validates, still clicks. Nothing
# goes red — the leads just stop, and the ones that were lost leave no trace.
#
# So this runs on every pull request rather than behind a path filter. The
# broader smoke suite is filtered because it is slow and its subjects are
# self-contained; this one is neither. A form submission touches validation,
# two services, the Supabase client, the confirmation screen and an edge
# function, so the change that breaks it usually lands somewhere else entirely.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quote-form:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --include=dev

      - name: Install Chromium
        # The browser binary comes from Playwright's CDN, so install it on its
        # own and retry. The system packages (libs, fonts) come from apt, whose
        # mirrors are what has been failing; try them but do not fail the job
        # on them. The apt step is attempted once, under a timeout, and never
        # retried: a retry would collide with the apt lock a stuck first
        # attempt can still be holding.
        run: |
          for attempt in 1 2 3; do
            if npx playwright install chromium; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Chromium download failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done
          if ! timeout --kill-after=10s 5m npx playwright install-deps chromium; then
            echo "::warning::Could not install Chromium's system packages from apt; continuing with what the runner image has"
          fi

      - name: Submit the form end to end
        run: npm run test:form
        env:
          CI: 'true'

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quote-form-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
