# .github/dependabot.yml
# Keeps dependencies current with low PR noise, and plays nicely with your
# dependabot-auto-merge.yml (which auto-merges patch + minor updates once checks pass).

version: 2
updates:
  # ── JavaScript / npm dependencies ────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    ignore:
      # vite-react-ssg@0.9.x declares peerOptional beasties@^0.1.0, so the 0.2+
      # releases fail `npm ci` with ERESOLVE. Lift this once vite-react-ssg
      # widens the range.
      - dependency-name: "beasties"
        versions: [">=0.2.0"]
      # recharts 3.10 tightened Tooltip formatter/labelFormatter typings, which
      # breaks typecheck at ~18 call sites. Lift once those are updated.
      - dependency-name: "recharts"
        versions: [">=3.10.0"]
    groups:
      # Packages whose peerDependencies pin each other's major version. Bumped
      # separately, every PR fails `npm ci` with ERESOLVE (e.g. react-stripe-js@7
      # needs stripe-js@10, while 6.x needs stripe-js@9). Group order matters:
      # a dependency lands in the first group it matches, so these come first.
      stripe:
        patterns:
          - "@stripe/*"
      vite-toolchain:
        patterns:
          - "vite"
          - "vite-react-ssg"
          - "@vitejs/*"
      # Batch all patch + minor bumps into ONE weekly PR.
      # These are the ones your auto-merge workflow lets through.
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Major version bumps are intentionally NOT grouped, so each one
    # arrives as its own PR and waits for you to review it.

  # ── GitHub Actions used in your workflows ────────────────────────
  # Keeps things like dependabot/fetch-metadata and actions/checkout current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    groups:
      github-actions:
        patterns:
          - "*"
