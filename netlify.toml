[build]
command = "npm ci --include=dev && npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"
NPM_FLAGS = "--include=dev"

[[headers]]
for = "/*"

[headers.values]
X-Robots-Tag = "index, follow"

[[headers]]
for = "/partners"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/services"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/about"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/services/furniture-assembly"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/services/tv-mounting"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/contact"

[headers.values]
X-Robots-Tag = "index, follow"
