[build]
command = "npm ci --include=dev && npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"
NPM_FLAGS = "--include=dev"

# Prerender.io Extension intercepts crawler requests (Googlebot, Bingbot, etc.)
# at the CDN edge and serves pre-rendered HTML before the SPA fallback applies.
# Token is configured in the Netlify Extension settings panel.

[[redirects]]
from = "http://*"
to = "https://:splat"
status = 301
force = true

[[headers]]
for = "/*"

[headers.values]
X-Robots-Tag = "index, follow"
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
for = "/partners"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

