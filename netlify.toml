[build]
command = "npm ci --include=dev && npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"
NPM_FLAGS = "--include=dev"
VITE_AUTHORIZED_ADMIN_EMAILS = "boxed2builtco@gmail.com"
VITE_AUTHORIZED_ADMIN_DOMAINS = "boxed2built.com"

[[redirects]]
from = "http://*"
to = "https://:splat"
status = 301
force = true

# Serve trailing-slash URLs directly instead of letting Netlify 301-redirect
# them to the non-slash version. The build uses dirStyle:"flat" (about.html,
# not about/index.html), so Netlify's default asset resolution redirects
# /about/ → /about. Google flags those as "Page with redirect". These rewrites
# intercept the request and serve the flat file at both paths with a 200.
# Single-segment paths (/about/, /faq/, /gallery/, etc.)
[[redirects]]
from = "/:page/"
to = "/:page"
status = 200
force = true

# Two-segment paths (/services/furniture-assembly/, /service-areas/spring-hill-tn/, etc.)
[[redirects]]
from = "/:section/:page/"
to = "/:section/:page"
status = 200
force = true

[[headers]]
for = "/*"

[headers.values]
X-Robots-Tag = "index, follow"
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Public marketing pages: always revalidate so content edits go live promptly.
# Wildcards cover /services/* and /service-areas/* so new landing pages inherit
# these headers without another entry here.
[[headers]]
for = "/services"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/services/*"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/service-areas"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/service-areas/*"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/about"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/contact"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/gallery"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/faq"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/partners"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/store"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/store/success"

[headers.values]
X-Robots-Tag = "noindex, follow"
Cache-Control = "no-store"

[[headers]]
for = "/gift-cards"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/redeem-gift-card"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/admin/*"

[headers.values]
X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/portal/*"

[headers.values]
X-Robots-Tag = "noindex, nofollow"

# Apple Pay domain verification. Stripe checks this file over HTTPS before it
# will render an Apple Pay button in the Express Checkout element on the pay
# page. It has no extension, so pin the type rather than let Netlify guess, and
# keep it out of the index. Absent the file the pay page still works — the
# wallet button simply never appears. See docs/apple-pay.md.
[[headers]]
for = "/.well-known/apple-developer-merchantid-domain-association"

[headers.values]
Content-Type = "text/plain"
X-Robots-Tag = "noindex, nofollow"
