[build]
command = "npm ci --include=dev && npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"
NPM_FLAGS = "--include=dev"
VITE_AUTHORIZED_ADMIN_EMAILS = "boxed2builtco@gmail.com"
VITE_AUTHORIZED_ADMIN_DOMAINS = "boxed2built.com"

[[redirects]]
from = "http://*"
to = "https://:splat"
status = 301
force = true

[[headers]]
for = "/*"

[headers.values]
X-Robots-Tag = "index, follow"
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Public marketing pages: always revalidate so content edits go live promptly.
# Wildcards cover /services/* and /service-areas/* so new landing pages inherit
# these headers without another entry here.
[[headers]]
for = "/services"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/services/*"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/service-areas"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/service-areas/*"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/about"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/contact"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/gallery"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/faq"

[headers.values]
X-Robots-Tag = "index, follow"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/partners"

[headers.values]
X-Robots-Tag = "index, follow"
